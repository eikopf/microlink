name: Check
on:
  push:
    branches: ['**']
    tags: ['v0.*']
  pull_request:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Check release version
        shell: bash
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-dev)?$ ]]
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$version" != *-dev && "$GITHUB_REF_NAME" == "v$version" ]]
          fi
      - name: Host tests and S3 firmware
        run: nix flake check --print-build-logs
